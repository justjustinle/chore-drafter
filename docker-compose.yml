# Local Postgres for development and tests.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chore
      POSTGRES_PASSWORD: chore
      POSTGRES_DB: chore_draft
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, on first start: creates the separate test database.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db-data:
